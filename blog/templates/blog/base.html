{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NagiLog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-brand" href="{% url 'dashboard' %}" aria-label="NagiLog ホーム">
                NagiLog
            </a>

            <nav class="site-nav" aria-label="メインナビゲーション">
                <a href="{% url 'dashboard' %}">Articles</a>
            </nav>

            {% if user.is_superuser %}
                <nav class="admin-nav" aria-label="管理者メニュー">
                    <span class="admin-nav__label">Admin</span>
                    <a href="{% url 'create' %}">新規記事作成</a>
                    <a href="{% url 'tag_create' %}">タグ作成</a>
                </nav>
            {% endif %}
        </div>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Built little by little. 🐇</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
