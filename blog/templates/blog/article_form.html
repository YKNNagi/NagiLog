{% load static %}
<form method="post">
    {% csrf_token %}
    
    {{ form.title }}
    <span id="title-count">0 / 50文字</span>
    {{ form.body }}
    {{ form.tags }}
    <div id="tag-buttons"></div>
    {{ form.is_pinned }}

    {% if form.instance.pk %}
        <button type="submit">更新する</button>
    {% else %}
        <button type="submit">投稿する</button>
    {% endif %}
</form>
<a href="{% url 'dashboard' %}">キャンセルして戻る</a>
<script src="{% static 'blog/js/article_form.js' %}"></script>
